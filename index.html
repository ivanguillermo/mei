<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Entrenadora App</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <!-- Tailwind CSS para diseño rápido y moderno -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col h-screen justify-between max-w-md mx-auto shadow-2xl overflow-hidden relative">

  <!-- CONTENEDOR DE VISTAS (TABS) -->
  <main class="flex-1 overflow-y-auto pb-20">
    
    <!-- VISTA 1: HOME -->
    <section id="view-home" class="view-section p-6 flex flex-col items-center text-center">
      <img src="./assets/mei_logo.png" alt="Logo Mei" class="w-24 h-24 object-contain mb-4">
      <h1 id="home-greeting" class="text-2xl font-bold uppercase tracking-wide text-indigo-600 mb-4">¡HOLA, [CLIENTE]!</h1>
      <p class="bg-indigo-50 border border-indigo-100 p-4 rounded-xl text-indigo-900 text-sm leading-relaxed shadow-sm">
        "Sere tu entrenadora te quiero mucho vivan los leones del caracas"
      </p>
    </section>

    <!-- VISTA 2: CENTRAL (ARTÍCULOS Y REDES) -->
    <section id="view-central" class="view-section p-6 hidden">
      <h2 class="text-xl font-bold mb-4 text-center text-gray-700">Contenido y Comunidad</h2>
      
      <!-- Redes Sociales Fijas -->
      <div class="bg-white p-4 rounded-xl shadow-sm mb-6 border border-gray-100">
        <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-3">Nuestras Redes</h3>
        <div class="flex justify-around items-center">
          <a href="#" class="text-indigo-600 font-medium hover:underline">Instagram</a>
          <a href="#" class="text-indigo-600 font-medium hover:underline">WhatsApp</a>
          <a href="#" class="text-indigo-600 font-medium hover:underline">TikTok</a>
        </div>
      </div>

      <!-- Artículos (Top 3 de la hoja Articulos) -->
      <div>
        <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-3">Artículos Destacados</h3>
        <div id="articles-container" class="space-y-4">
          <!-- Inyectado dinámicamente desde JS -->
          <p class="text-center text-gray-400 text-sm">Cargando artículos...</p>
        </div>
      </div>
    </section>

    <!-- VISTA 3: PERFIL CORTO Y MÓDULOS -->
    <section id="view-profile" class="view-section p-6 hidden">
      <div class="flex items-center space-x-4 bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-6">
        <!-- Foto de perfil de Google o placeholder -->
        <img id="profile-pic" src="https://via.placeholder.com/80" alt="Foto perfil" class="w-16 h-16 rounded-full object-cover border-2 border-indigo-500">
        <div>
          <h2 id="profile-name" class="font-bold text-lg text-gray-800">Nombre Apellido</h2>
          <p class="text-sm text-gray-500">Tel: <span id="profile-tel">-</span></p>
          <p class="text-sm text-gray-500">Edad: <span id="profile-age">-</span></p>
        </div>
      </div>

      <!-- Cuerpo del perfil corto -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-6 space-y-2 text-sm">
        <div class="flex justify-between border-b pb-2"><span class="text-gray-500">Horario:</span> <span id="val-horario" class="font-medium">-</span></div>
        <div class="flex justify-between border-b pb-2"><span class="text-gray-500">Días:</span> <span id="val-dias" class="font-medium">-</span></div>
        <div class="flex justify-between border-b pb-2"><span class="text-gray-500">Próxima Valoración:</span> <span id="val-valoracion" class="font-medium">-</span></div>
        <div class="flex justify-between"><span class="text-gray-500">Próximo Pago:</span> <span id="val-pago" class="font-medium">-</span></div>
      </div>

      <!-- Módulos Apps (Espacios reservados para JS independientes) -->
      <div class="grid grid-cols-2 gap-3">
        <button onclick="loadModule('rutinas')" class="p-3 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold rounded-xl text-sm transition text-center shadow-xs">Rutinas</button>
        <button onclick="loadModule('medidas')" class="p-3 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold rounded-xl text-sm transition text-center shadow-xs">Medidas</button>
        <button onclick="loadModule('alimentacion')" class="p-3 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold rounded-xl text-sm transition text-center shadow-xs">Alimentación</button>
        <button onclick="loadModule('atleta')" class="p-3 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold rounded-xl text-sm transition text-center shadow-xs">Atleta</button>
      </div>
    </section>

  </main>

  <!-- MENÚ INFERIOR (3 BOTONES) -->
  <nav class="absolute bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around items-center h-16 shadow-lg">
    <button onclick="switchTab('home')" class="nav-btn flex flex-col items-center text-indigo-600 focus:outline-none">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      <span class="text-xs mt-1">Home</span>
    </button>
    
    <!-- Botón central con logo para apps -->
    <button onclick="switchTab('central')" class="nav-btn flex flex-col items-center text-gray-400 hover:text-indigo-600 focus:outline-none">
      <img src="./assets/mei_logo.png" alt="Apps" class="w-6 h-6 object-contain">
      <span class="text-xs mt-1">Apps</span>
    </button>
    
    <button onclick="switchTab('profile')" class="nav-btn flex flex-col items-center text-gray-400 hover:text-indigo-600 focus:outline-none">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      <span class="text-xs mt-1">Perfil</span>
    </button>
  </nav>

  <!-- Scripts principales y preparación de módulos -->
  <script src="app.js"></script>
</body>
</html>
