<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d4e4f">
  <title>Mei Rivero</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="app">

    <!-- LOGIN -->
    <section id="login-screen" class="screen login">
      <img src="assets/mei_logo.png" alt="Mei Rivero" class="login-logo">
      <h1>Bienvenida</h1>
      <p>Inicia sesión con tu cuenta de Google para ver tu entrenamiento.</p>
      <div id="g-signin"></div>
      <p id="login-error" class="error hidden"></p>
    </section>

    <!-- CARGANDO -->
    <div id="loading" class="loading hidden"><div class="spinner"></div></div>

    <!-- VISTAS -->
    <main id="app-main" class="hidden">

      <!-- HOME -->
      <section id="view-home" class="view home">
        <svg class="wave" viewBox="0 0 400 260" preserveAspectRatio="none" aria-hidden="true">
          <path d="M0 120 C 120 150, 250 60, 400 0 L400 260 L0 260 Z" fill="var(--teal)"/>
          <path d="M0 170 C 140 190, 260 110, 400 60 L400 260 L0 260 Z" fill="var(--teal-dark)" opacity=".25"/>
        </svg>
        <img src="assets/mei_logo.png" alt="Mei Rivero" class="home-logo">
        <div class="home-text">
          <h1 id="home-greeting">Hola</h1>
          <hr class="rule">
          <p id="home-intro"></p>
        </div>
      </section>

      <!-- APPS -->
      <section id="view-apps" class="view hidden">
        <h2 class="view-title">Apps</h2>
        <div class="card id-card">
          <img id="apps-photo" class="avatar" alt="Foto">
          <div>
            <p id="apps-name" class="id-name"></p>
            <p class="id-line"><svg viewBox="0 0 24 24" class="i"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.100 4.200 2 2 0 0 1 4.100 2h3a2 2 0 0 1 2 1.700c.1 1 .4 1.900.7 2.800a2 2 0 0 1-.5 2.100L8.100 9.900a16 16 0 0 0 6 6l1.300-1.300a2 2 0 0 1 2.100-.4c.9.300 1.800.6 2.800.7a2 2 0 0 1 1.700 2z"/></svg><span id="apps-tel">-</span></p>
            <p class="id-line"><svg viewBox="0 0 24 24" class="i"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span id="apps-age">-</span></p>
          </div>
        </div>

        <div id="apps-grid" class="apps-grid"></div>

        <h3 class="section-title">Artículos de interés</h3>
        <div id="articles" class="articles"></div>

        <div id="socials" class="socials"></div>
      </section>

      <!-- PERFIL -->
      <section id="view-profile" class="view hidden">
        <h2 class="view-title">Perfil</h2>
        <div class="profile-head">
          <img id="profile-photo" class="avatar big" alt="Foto">
          <h3 id="profile-name"></h3>
        </div>
        <div class="card info-list" id="profile-data"></div>
        <h3 class="section-title">Mi plan</h3>
        <div class="card info-list" id="profile-plan"></div>
        <h3 class="section-title">Condiciones</h3>
        <div class="card"><p id="profile-conditions" class="conditions"></p></div>
        <button id="btn-logout" class="btn-ghost">Cerrar sesión</button>
      </section>
    </main>

    <!-- MENÚ INFERIOR -->
    <nav id="app-nav" class="nav hidden">
      <button data-tab="home" class="active">
        <svg viewBox="0 0 24 24"><path d="M3 11.500 12 4l9 7.500"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg><span>Home</span>
      </button>
      <button data-tab="apps">
        <svg viewBox="0 0 24 24"><rect x="3.500" y="3.500" width="7" height="7" rx="1.500"/><rect x="13.500" y="3.500" width="7" height="7" rx="1.500"/><rect x="3.500" y="13.500" width="7" height="7" rx="1.500"/><rect x="13.500" y="13.500" width="7" height="7" rx="1.500"/></svg><span>Apps</span>
      </button>
      <button data-tab="profile">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Perfil</span>
      </button>
    </nav>

    <!-- HOJA PARA CADA APP (Rutinas, Medidas...) -->
    <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
      <div class="sheet-panel">
        <header>
          <h2 id="sheet-title"></h2>
          <button id="sheet-close" aria-label="Cerrar">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </header>
        <div id="sheet-body" class="sheet-body"></div>
      </div>
    </div>
  </div>

  <!-- Núcleo -->
  <script src="app.js"></script>
  <!-- Una línea por cada app. Para agregar una nueva: crea js/nombre.js y añade su <script> aquí -->
  <script src="js/rutinas.js"></script>
  <script src="js/alimentacion.js"></script>
  <script src="js/medidas.js"></script>
  <script src="js/atletas.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(console.error));
    }
  </script>
</body>
</html>
